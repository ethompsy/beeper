[package]
name = "beeper-operator"
version = "0.1.0"
edition = "2021"
description = "Beeper Kubernetes operator - watches for anomalies and spawns investigators"
authors = ["Beeper Team"]
license = "Apache-2.0"

[dependencies]
kube = { version = "0.95", features = ["runtime", "derive"] }
kube-runtime = "0.95"
k8s-openapi = { version = "0.23", features = ["v1_30"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
schemars = "0.8"
axum = "0.7"
futures = "0.3"
thiserror = "1"
anyhow = "1"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
prost = "0.13"
snap = "1.1"
bytes = "1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.5"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
