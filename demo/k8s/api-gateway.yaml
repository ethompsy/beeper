apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api-gateway
  namespace: beeper-demo
  labels:
    app: demo-api-gateway
    app.kubernetes.io/part-of: beeper-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api-gateway
  template:
    metadata:
      labels:
        app: demo-api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api-gateway
          image: beeper/demo-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_ROLE
              value: "api-gateway"
            - name: SERVICE_PORT
              value: "8080"
            - name: FAULT_ENABLED
              value: "false"
            - name: FAULT_TYPE
              value: "none"
            - name: SYNTHETIC_TRAFFIC
              value: "true"
            - name: BACKEND_URL
              value: "http://demo-backend:8081"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api-gateway
  namespace: beeper-demo
  labels:
    app: demo-api-gateway
    app.kubernetes.io/part-of: beeper-demo
spec:
  selector:
    app: demo-api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
