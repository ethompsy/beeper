apiVersion: beeper.dev/v1
kind: ServiceLevel
metadata:
  name: otel-cart-slo
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: otel-demo
spec:
  service: "cart"
  sli:
    type: availability
    metric: "http_server_request_duration_seconds_count"
    # Cart (.NET) uses new OTel semconv label; only 2xx is "good" (no redirects from this API)
    good_selector: '{service_name="cart",http_response_status_code=~"2.."}'
    total_selector: '{service_name="cart"}'
  objective:
    target: 0.999
    window: "30m"
  burn_rate_alerts:
    - severity: warning
      short_window: "5m"
      long_window: "1h"
      factor: 14.4
    - severity: critical
      short_window: "2m"
      long_window: "15m"
      factor: 14.4
