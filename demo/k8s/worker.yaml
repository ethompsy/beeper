apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-worker
  namespace: beeper-demo
  labels:
    app: demo-worker
    app.kubernetes.io/part-of: beeper-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-worker
  template:
    metadata:
      labels:
        app: demo-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: worker
          image: beeper/demo-app:latest
          ports:
            - containerPort: 8083
          env:
            - name: SERVICE_ROLE
              value: "worker"
            - name: SERVICE_PORT
              value: "8083"
            - name: FAULT_ENABLED
              value: "false"
            - name: FAULT_TYPE
              value: "none"
            - name: SYNTHETIC_TRAFFIC
              value: "true"
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-worker
  namespace: beeper-demo
  labels:
    app: demo-worker
    app.kubernetes.io/part-of: beeper-demo
spec:
  selector:
    app: demo-worker
  ports:
    - port: 8083
      targetPort: 8083
      protocol: TCP
