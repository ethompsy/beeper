# Helm values overlay for OpenTelemetry Astronomy Shop
# Used with: helm install otel-demo open-telemetry/opentelemetry-demo -f demo/otel-demo-values.yaml
#
# This configures the OTel demo to forward metrics and logs to Beeper's
# operator ingestion endpoint, and keeps the deployment lean for demos.

# --- OTel Collector: Prometheus remote write to Beeper ---
# Forwards metrics to Beeper ingestion for anomaly detection alongside Prometheus.

# --- Components ---
components:
  # Feature flags (flagd) — allows fault injection via UI or API
  flagd:
    enabled: true
    resources:
      limits:
        cpu: 100m
        memory: 64Mi

  # Load generator — Locust-based, generates realistic user traffic
  load-generator:
    enabled: true

  # Service resource overrides (keep demo lean)
  frontend:
    resources:
      limits:
        cpu: 300m
        memory: 256Mi

  cart:
    resources:
      limits:
        cpu: 300m
        memory: 256Mi

  checkout:
    resources:
      limits:
        cpu: 300m
        memory: 256Mi

  payment:
    resources:
      limits:
        cpu: 200m
        memory: 128Mi

  # Accounting — Kafka consumer, needs more memory than default 120Mi
  accounting:
    resources:
      limits:
        memory: 256Mi

  ad:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi

# --- Observability backends (keep minimal for demos) ---
# TODO(demo direct-access): to reach the OTel Shop and Jaeger at localhost:8080 /
# :16686 WITHOUT `make demo-ui` port-forwarding, expose these as NodePorts whose
# numbers match kind-config.yaml's extraPortMappings (frontend-proxy -> 30080,
# jaeger -> 30686), then recreate the cluster. The exact override keys depend on
# the opentelemetry-demo chart version (e.g. components.frontend-proxy.service /
# jaeger.service) — verify with `helm template` against the pinned chart version
# before enabling. Left commented so an unverified schema can't break demo-deploy.
jaeger:
  enabled: true

grafana:
  enabled: false

opensearch:
  enabled: false

prometheus:
  enabled: true
  server:
    resources:
      limits:
        memory: 768Mi

# --- OTel Collector: log forwarding to Beeper via OTLP HTTP ---
opentelemetry-collector:
  config:
    exporters:
      otlphttp/beeper:
        endpoint: http://beeper-operator-ingestion.beeper.svc:9090
        encoding: json
        compression: none
        tls:
          insecure: true
      prometheusremotewrite/beeper:
        endpoint: http://beeper-operator-ingestion.beeper.svc:9090/api/v1/write
        tls:
          insecure: true
    service:
      pipelines:
        logs:
          processors: [memory_limiter, resourcedetection, resource, batch]
          exporters: [otlphttp/beeper, debug]
        metrics:
          processors: [memory_limiter, resourcedetection, resource, batch]
          exporters: [prometheusremotewrite/beeper]
