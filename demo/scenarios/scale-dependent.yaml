# Demo Scenario: Scale-Dependent Latency
# Demonstrates latency anomaly detection under load.
#
# Usage: make demo-scenario SCENARIO=scale-dependent

name: scale-dependent
description: >
  Demonstrates latency anomaly detection under load. Response time
  increases with concurrent requests, simulating resource contention.
  Beeper detects via SLO burn rate and proposes HPA scaling.

fault_type: scale-dependent
trust_level: 5
duration_estimate_seconds: 53

timing:
  detect_seconds: 8
  investigate_seconds: 15
  fix_propose_seconds: 5
  fix_apply_seconds: 5
  verify_seconds: 10
  recover_seconds: 5
  kb_create_seconds: 5

expected_stages:
  - healthy
  - fault_injected
  - detecting
  - investigating
  - fix_proposed
  - fix_applied
  - verifying
  - recovered
  - kb_created
