# Demo Scenario: Bad Deploy
# Simulates a broken code deployment causing HTTP 500 error rate spike.
#
# Usage: make demo-scenario SCENARIO=bad-deploy

name: bad-deploy
description: >
  Simulates a broken code deployment causing HTTP 500 error rate spike.
  Beeper detects via SLO burn rate alert, traces to recent deployment,
  and proposes rollback.

fault_type: bad-deploy
trust_level: 5
duration_estimate_seconds: 42

timing:
  detect_seconds: 6
  investigate_seconds: 12
  fix_propose_seconds: 4
  fix_apply_seconds: 4
  verify_seconds: 8
  recover_seconds: 4
  kb_create_seconds: 4

expected_stages:
  - healthy
  - fault_injected
  - detecting
  - investigating
  - fix_proposed
  - fix_applied
  - verifying
  - recovered
  - kb_created
