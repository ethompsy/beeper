[tool.poetry]
name = "beeper-ui"
version = "0.1.0"
description = "Beeper web UI - Flask application for viewing investigations and managing knowledge base"
authors = ["Beeper Team"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "beeper_ui"}]

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.0"
qdrant-client = "^1.8"
httpx = "^0.27"
python-dotenv = "^1.0"
markdown = "^3.5"
bleach = "^6.1"
litellm = "^1.30"
slack-sdk = "^3.27"
# Task 8.5 / ADR 0002 §3: OIDC RP (authorization-code flow, JWKS
# fetch/rotation-cache, full ID-token validation). Deliberate transitive
# additions, recorded in the ADR: `requests`, `cryptography`.
authlib = "^1.6"

# Task 8.6 (ADR 0002 §6, FR59) — argon2id password hashing for `local`-mode
# accounts. See ui/beeper_ui/services/password_hashing.py for the pinned
# RFC 9106 §4 parameter choice.
argon2-cffi = "^23.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-flask = "^1.3"
ruff = "^0.3"
mypy = "^1.8"
respx = "^0.21"
pytest-asyncio = "^0.24"
types-bleach = "^6.1"
types-Markdown = "^3.5"
# Task 8.8 (SCIM surface): dev-only, response-shape conformance oracle for
# tests/_scim_json_schemas.py against RFC 7643 — never imported by
# production code (ADR 0002 §4: "JSON-Schema response validation is a
# dev-dependency only"). Already resolvable transitively via `litellm`'s
# own `jsonschema` requirement; declared explicitly here since test code
# now imports it directly.
jsonschema = "^4.20"
# Task 8.5 / ADR 0002 §9: "responses not respx for Authlib stubs" — Authlib's
# Flask/requests OAuth client uses `requests`, not `httpx`, so its HTTP
# boundary (discovery doc, JWKS, token endpoint, UserInfo) is mocked with
# `responses`, unlike the `respx`-mocked `httpx` clients elsewhere in this
# suite (litellm, operator client).
responses = "^0.25"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
