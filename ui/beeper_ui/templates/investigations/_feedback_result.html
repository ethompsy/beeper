{% if error_message %}
<div class="feedback-buttons">
    <div class="feedback-error">
        <p>{{ error_message }}</p>
    </div>
    {% include "investigations/_feedback_buttons.html" with context %}
</div>
{% else %}
{% include "investigations/_feedback_buttons.html" with context %}
<p class="feedback-success">Feedback recorded: <strong>{{ feedback_label }}</strong></p>
{% endif %}
