<div id="collab-panel" class="collaboration-panel"
     data-investigation-id="{{ investigation.id }}"
     data-investigation-status="{{ investigation.status }}">
  <div class="collab-header">
    <span class="collab-title">Collaboration</span>
    <span id="active-users" class="collab-active-users"></span>
    <span id="collab-status" class="collab-connection-status">Connecting&hellip;</span>
  </div>
  <div id="collab-messages" class="collab-messages">
    <!-- Messages appended here by investigation-collab.js -->
  </div>
  <div class="collab-input-area">
    <input id="collab-input" type="text" placeholder="Type a message&hellip;"
           class="collab-input" autocomplete="off">
    <button onclick="sendCollabMessage()" class="collab-send-btn">Send</button>
  </div>
  <div id="collab-annotation-input" class="collab-action-input" style="display:none;">
    <div class="collab-action-label">Annotation</div>
    <input id="annotation-text" type="text" placeholder="Add annotation&hellip;"
           class="collab-input" autocomplete="off">
    <div class="collab-action-buttons">
      <button onclick="submitAnnotation()" class="collab-send-btn">Submit</button>
      <button onclick="cancelAnnotation()" class="collab-cancel-btn">Cancel</button>
    </div>
  </div>
  <div id="collab-redirect-input" class="collab-action-input" style="display:none;">
    <div class="collab-action-label collab-redirect-label">Redirect</div>
    <input id="redirect-text" type="text" placeholder="Redirect: describe new investigation focus&hellip;"
           class="collab-input" autocomplete="off">
    <div class="collab-action-buttons">
      <button onclick="submitRedirect()" class="collab-send-btn">Submit</button>
      <button onclick="cancelRedirect()" class="collab-cancel-btn">Cancel</button>
    </div>
  </div>
  <div id="collab-reject-input" class="collab-action-input" style="display:none;">
    <div class="collab-action-label collab-reject-label">Reject Fix</div>
    <input id="reject-reason-text" type="text" placeholder="Reason for rejection (optional)&hellip;"
           class="collab-input" autocomplete="off">
    <div class="collab-action-buttons">
      <button onclick="submitReject()" class="collab-send-btn">Submit</button>
      <button onclick="cancelReject()" class="collab-cancel-btn">Cancel</button>
    </div>
  </div>
  <div class="collab-action-bar">
    <button onclick="toggleAnnotationInput()" class="collab-action-btn collab-annotate-btn" title="Annotate (n)">
      Annotate
    </button>
    <button id="redirect-btn" onclick="toggleRedirectInput()" class="collab-action-btn collab-redirect-btn" title="Redirect (r)"
            {% if investigation.status != 'investigating' %}disabled{% endif %}>
      Redirect
    </button>
  </div>
  <div id="collab-approval-bar" class="collab-approval-bar" style="display:none;">
    <span id="approval-context" class="collab-approval-context"></span>
    <button id="approve-btn" onclick="submitApprove()" class="collab-approve-btn" title="Approve (a)">
      Approve
    </button>
    <button id="reject-fix-btn" onclick="toggleRejectInput()" class="collab-reject-btn" title="Reject (x)">
      Reject
    </button>
  </div>
</div>
