{# Filter panel for Investigation list filtering #}
{# CSS-only accordion - no JavaScript required #}
<div class="filter-panel" id="investigation-filter-panel">
    <input type="checkbox" id="inv-filter-toggle-checkbox" class="filter-toggle-checkbox" checked aria-hidden="true">
    <div class="filter-header">
        <h4>Filters</h4>
        <label for="inv-filter-toggle-checkbox" class="filter-toggle" aria-label="Toggle filters">
            <span class="toggle-icon"></span>
        </label>
    </div>

    <div class="filter-body">
        <div class="filter-row">
            {# Status Filter #}
            <div class="filter-group">
                <label for="inv-filter-status">Status</label>
                <select name="status"
                        id="inv-filter-status"
                        hx-get="{{ url_for('investigations.list_investigations') }}"
                        hx-trigger="change"
                        hx-target="#investigation-list"
                        hx-include="#investigation-filter-panel select"
                        hx-push-url="true">
                    <option value="">All statuses</option>
                    <option value="investigating" {% if selected_status == 'investigating' %}selected{% endif %}>In Progress</option>
                    <option value="awaiting_confirmation" {% if selected_status == 'awaiting_confirmation' %}selected{% endif %}>Awaiting Confirmation</option>
                    <option value="completed" {% if selected_status == 'completed' %}selected{% endif %}>Completed</option>
                    <option value="failed" {% if selected_status == 'failed' %}selected{% endif %}>Failed</option>
                </select>
            </div>

            {# Service Filter #}
            <div class="filter-group">
                <label for="inv-filter-service">Service</label>
                <select name="service"
                        id="inv-filter-service"
                        hx-get="{{ url_for('investigations.list_investigations') }}"
                        hx-trigger="change"
                        hx-target="#investigation-list"
                        hx-include="#investigation-filter-panel select"
                        hx-push-url="true">
                    <option value="">All services</option>
                </select>
            </div>

            {# Severity Filter #}
            <div class="filter-group">
                <label for="inv-filter-severity">Severity</label>
                <select name="severity"
                        id="inv-filter-severity"
                        hx-get="{{ url_for('investigations.list_investigations') }}"
                        hx-trigger="change"
                        hx-target="#investigation-list"
                        hx-include="#investigation-filter-panel select"
                        hx-push-url="true">
                    <option value="">All severities</option>
                    <option value="low" {% if selected_severity == 'low' %}selected{% endif %}>Low</option>
                    <option value="medium" {% if selected_severity == 'medium' %}selected{% endif %}>Medium</option>
                    <option value="high" {% if selected_severity == 'high' %}selected{% endif %}>High</option>
                    <option value="critical" {% if selected_severity == 'critical' %}selected{% endif %}>Critical</option>
                </select>
            </div>

            {# Date Range Filter #}
            <div class="filter-group">
                <label for="inv-filter-date-range">Date Range</label>
                <select name="date_range"
                        id="inv-filter-date-range"
                        hx-get="{{ url_for('investigations.list_investigations') }}"
                        hx-trigger="change"
                        hx-target="#investigation-list"
                        hx-include="#investigation-filter-panel select"
                        hx-push-url="true">
                    <option value="">All time</option>
                    <option value="today" {% if selected_date_range == 'today' %}selected{% endif %}>Today</option>
                    <option value="7d" {% if selected_date_range == '7d' %}selected{% endif %}>Last 7 days</option>
                    <option value="30d" {% if selected_date_range == '30d' %}selected{% endif %}>Last 30 days</option>
                    <option value="90d" {% if selected_date_range == '90d' %}selected{% endif %}>Last 90 days</option>
                </select>
            </div>
        </div>
    </div>
</div>
