<div id="command-palette-overlay" class="command-palette-overlay">
    <div class="command-palette">
        <input
            id="command-search"
            type="text"
            role="combobox"
            aria-label="Search commands and navigation"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-owns="command-results"
            placeholder="Type a command or search..."
        />
        <ul id="command-results" role="listbox"></ul>
    </div>
</div>
