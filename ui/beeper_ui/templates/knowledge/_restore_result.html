{% if success %}
<div class="restore-result restore-success">
    <div class="result-icon">&#10003;</div>
    <h3>Version Restored</h3>
    <p>Version {{ restored_version }} has been restored as version {{ new_version }}.</p>
    <p><a href="{{ url_for('knowledge.kb_entry', entry_id=entry_id) }}" class="btn btn-primary">View Current Entry</a></p>
</div>
{% elif error %}
<div class="restore-result restore-error">
    <div class="result-icon">&#10007;</div>
    <h3>Error</h3>
    <p class="error-message">{{ error }}</p>
</div>
{% endif %}
