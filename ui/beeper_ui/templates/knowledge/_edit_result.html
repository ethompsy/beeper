{% if success %}
<div class="edit-result edit-success">
    <div class="result-icon">&#10003;</div>
    <h3>Changes Saved</h3>
    <p><strong>{{ title }}</strong> updated to version {{ new_version }}.</p>
    <p><a href="{{ url_for('knowledge.kb_entry', entry_id=entry_id) }}" class="btn btn-primary">View Entry</a></p>
</div>
{% elif error %}
<div class="edit-result edit-error">
    <div class="result-icon">&#10007;</div>
    <h3>Error</h3>
    <p class="error-message">{{ error }}</p>
</div>
{% endif %}
