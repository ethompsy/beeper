# Default values for Beeper Helm chart

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# Operator configuration
operator:
  replicaCount: 1
  image:
    repository: beeper/operator
    tag: ""  # Defaults to Chart appVersion
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi
  ingestion:
    port: 9090
    bufferSize: 10000
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# UI configuration
ui:
  replicaCount: 1
  image:
    repository: beeper/ui
    tag: ""  # Defaults to Chart appVersion
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 192Mi
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: beeper.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# Qdrant vector database
qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: "v1.15.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi
  # Collection configuration (used by init-collections script)
  collections:
    vectorDimension: 1536
    distanceMetric: Cosine

# Investigator Job configuration
# Jobs are spawned by the operator for each Investigation CR
investigator:
  image:
    repository: beeper/investigator
    tag: ""  # Defaults to Chart appVersion
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  # Job behavior configuration
  # Number of retries before marking investigation as failed
  backoffLimit: 2
  # Time to keep completed Jobs before automatic cleanup (seconds)
  ttlSecondsAfterFinished: 3600  # 1 hour
  # Maximum time for an investigation to complete (seconds)
  activeDeadlineSeconds: 1800   # 30 minutes
  # ServiceAccount for investigator pods
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# LLM Provider configuration
# Supported providers: anthropic, openai, azure, ollama
# See helm/beeper/examples/llm-secret.yaml for secret creation instructions
llm:
  # Provider selection: anthropic (default), openai, azure, ollama
  provider: anthropic
  # Model identifier (depends on provider)
  # Anthropic: claude-sonnet-4, claude-3-haiku, claude-opus-4
  # OpenAI: gpt-4o, gpt-4-turbo
  # Azure: azure/<deployment-name>
  # Ollama: ollama/llama3
  model: claude-3-5-haiku-20241022
  # Kubernetes Secret containing the API key
  # Create with: kubectl create secret generic llm-credentials --from-literal=api-key=<your-key>
  apiKeySecret: llm-credentials
  # Key within the secret (default: api-key)
  apiKeySecretKey: api-key
  # Optional: custom endpoint (required for Azure, optional for Ollama)
  # endpoint: ""
  # Cost management (future implementation in Story 3.9)
  maxTokensPerInvestigation: 100000
  maxConcurrentInvestigations: 2

# Observability sources
sources:
  prometheus:
    enabled: false
    endpoint: ""
  loki:
    enabled: false
    endpoint: ""

# Pod security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Node selector for all pods
nodeSelector: {}

# Tolerations for all pods
tolerations: []

# Affinity for all pods
affinity: {}
