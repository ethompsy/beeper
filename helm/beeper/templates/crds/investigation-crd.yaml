apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: investigations.beeper.dev
  labels:
    {{- include "beeper.labels" . | nindent 4 }}
spec:
  group: beeper.dev
  names:
    kind: Investigation
    listKind: InvestigationList
    plural: investigations
    singular: investigation
    shortNames:
      - inv
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - condition
                - service
              properties:
                condition:
                  type: string
                  description: Description of the detected condition triggering investigation
                service:
                  type: string
                  description: Name of the affected service
                severity:
                  type: string
                  description: Severity level of the condition
                  enum:
                    - low
                    - medium
                    - high
                    - critical
                  default: medium
                triggered_at:
                  type: string
                  format: date-time
                  description: When the condition was first detected (ISO 8601)
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Current phase of the investigation
                  enum:
                    - pending
                    - running
                    - completed
                    - failed
                started_at:
                  type: string
                  format: date-time
                  description: When the investigation started (ISO 8601)
                completed_at:
                  type: string
                  format: date-time
                  description: When the investigation completed (ISO 8601)
                job_name:
                  type: string
                  description: Name of the K8s Job running the investigator
                error:
                  type: string
                  description: Error message if investigation failed
                message:
                  type: string
                  description: Progress message from the investigator pod
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Service
          type: string
          jsonPath: .spec.service
        - name: Severity
          type: string
          jsonPath: .spec.severity
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
