apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beeper.fullname" . }}-operator
  labels:
    {{- include "beeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "beeper.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "beeper.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "beeper.operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: operator
          image: {{ include "beeper.operator.image" . }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: ingestion
              containerPort: {{ .Values.operator.ingestion.port | default 9090 }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,beeper_operator::ingestion::buffer=error,beeper_operator::controllers::servicelevel=warn,beeper_operator::controllers::investigation=warn"
            - name: BEEPER_INGESTION_BUFFER_SIZE
              value: {{ .Values.operator.ingestion.bufferSize | default 10000 | quote }}
            - name: QDRANT_URL
              value: "http://{{ include "beeper.fullname" . }}-qdrant:6333"
            - name: PROMETHEUS_URL
              value: "http://prometheus.otel-demo.svc:9090"
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.apiKeySecret }}
                  key: {{ .Values.llm.apiKeySecretKey }}
                  optional: true
            - name: BEEPER_DETECTION_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: BEEPER_INVESTIGATOR_IMAGE
              value: {{ include "beeper.investigator.image" . }}
            - name: BEEPER_INVESTIGATOR_IMAGE_PULL_POLICY
              value: {{ .Values.investigator.image.pullPolicy }}
            - name: BEEPER_INVESTIGATOR_QDRANT_HOST
              value: "{{ include "beeper.fullname" . }}-qdrant"
            - name: BEEPER_INVESTIGATOR_SERVICE_ACCOUNT
              value: {{ include "beeper.investigatorServiceAccountName" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
