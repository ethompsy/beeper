# Example Kubernetes Secret for LLM API credentials
#
# To create this secret:
# 1. Replace <your-api-key> with your actual API key
# 2. Apply with: kubectl apply -f llm-secret.yaml
#
# Or create directly with kubectl:
# kubectl create secret generic llm-credentials \
#   --from-literal=api-key=your-api-key-here
#
# For Anthropic Claude:
#   Get your API key from https://console.anthropic.com/
#
# For OpenAI:
#   Get your API key from https://platform.openai.com/api-keys
#
# For Azure OpenAI:
#   Get your API key from the Azure portal

apiVersion: v1
kind: Secret
metadata:
  name: llm-credentials
  labels:
    app.kubernetes.io/name: beeper
    app.kubernetes.io/component: llm
type: Opaque
stringData:
  # Use stringData for plain text (automatically base64 encoded)
  api-key: <your-api-key>

---
# Alternative: Azure OpenAI requires additional configuration
# Uncomment and configure if using Azure OpenAI
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: azure-llm-credentials
#   labels:
#     app.kubernetes.io/name: beeper
#     app.kubernetes.io/component: llm
# type: Opaque
# stringData:
#   api-key: <your-azure-api-key>
#   # Azure-specific: endpoint is configured in the LLM config, not here

---
# Example LLM configuration to add to your ConfigMap or values.yaml
#
# llm:
#   provider: anthropic           # Options: anthropic, openai, azure, ollama
#   model: claude-sonnet-4        # Model identifier
#   apiKeySecret: llm-credentials # Name of the Secret created above
#   apiKeySecretKey: api-key      # Key within the Secret (default: api-key)
#   # endpoint: ""                # Optional: custom endpoint for Azure/Ollama
