# Example Kubernetes Secret for Beeper UI identity/auth (Task 8.9, ADR 0002 §8)
#
# This is the ONE Secret named by `ui.auth.existingSecret`. It carries
# whichever of the six keys below the auth mode/features you've enabled
# actually need — see docs/deployment-guide.md#authentication--identity
# for the full per-mode reference. Every key is consumed via an
# `optional: true` secretKeyRef, so a Secret missing a key never
# crash-loops the pod at the Kubernetes layer — omit keys you don't need.
#
# Generate strong random values, e.g.:
#   SECRET_KEY / SCIM tokens:  python3 -c "import secrets; print(secrets.token_hex(32))"
#   bootstrap admin password:  a real password >=12 chars (argon2id at rest)
#
# Apply with: kubectl apply -f identity-secret.yaml
# Or create directly with kubectl (no file on disk):
#   kubectl create secret generic beeper-identity \
#     --from-literal=secretKey="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
#     --from-literal=clientSecret=<your-oidc-client-secret> \
#     --from-literal=scimToken="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
#     --from-literal=bootstrapUsername=admin \
#     --from-literal=bootstrapPassword=<a-strong-password>
#
# **The SCIM token (scimToken/scimTokenSecondary) is an admin-equivalent
# secret** — group membership assignment through it IS the admin grant
# (ADR 0002 §4, security HIGH-5). Handle it with the SAME rigor as
# secretKey/SECRET_KEY: never log it, never put it in a values.yaml, and
# follow the dual-token rotation runbook in docs/deployment-guide.md when
# rotating it — never just delete-and-replace scimToken directly, that
# causes IdP-visible provisioning downtime.

apiVersion: v1
kind: Secret
metadata:
  name: beeper-identity
  labels:
    app.kubernetes.io/name: beeper
    app.kubernetes.io/component: ui
type: Opaque
stringData:
  # --- local / oidc (required in both) ---------------------------------
  # Flask session-signing key. MUST be stable across pod restarts and
  # identical across replicas — sessions are invalidated the instant this
  # value changes. Rotating it logs out every active session.
  secretKey: <generate-with-secrets.token_hex-32>

  # --- oidc mode (required) --------------------------------------------
  # The OIDC client secret issued by your IdP (Okta/Entra/Keycloak) for
  # Beeper's confidential client registration.
  clientSecret: <your-oidc-client-secret>

  # --- oidc mode + scim.enabled (required) -----------------------------
  # Long-lived bearer token(s) the IdP's SCIM connector authenticates
  # with. scimTokenSecondary is optional — set it ONLY during a rotation
  # window (see the dual-token rotation runbook); both values are accepted
  # simultaneously for as long as both are set.
  scimToken: <generate-with-secrets.token_hex-32>
  scimTokenSecondary: <optional-second-token-for-zero-downtime-rotation>

  # --- local mode + auth.bootstrap.enabled (optional) -------------------
  # The first local admin, seeded idempotently on boot (never overwritten
  # on restart — a rotated password is never reverted). If omitted, seed
  # the first admin instead via:
  #   kubectl exec -it deploy/<release>-ui -- flask --app beeper_ui \
  #     create-admin <username> --password-stdin
  bootstrapUsername: admin
  bootstrapPassword: <a-strong-password-at-least-12-characters>
