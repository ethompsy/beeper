# Development overrides for Beeper Helm chart

# Local qwen3:8b is slow (~15 tok/s) and the deep-RCA step keeps <think> ON for
# diagnosis quality, so a full investigation runs well past the 30-min default.
# Give the demo headroom so investigations COMPLETE instead of being killed by
# the Job deadline (Q4). On a fast cloud model the default (1800) is plenty.
investigator:
  activeDeadlineSeconds: 5400  # 90 min

# Use local images for development
operator:
  image:
    pullPolicy: Never
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi

ui:
  # Task 8.2 / ADR 0002 §8 (D3): the chart defaults ui.flaskEnv to
  # `production` (fail-closed). The demo opts into `development` here so
  # `make demo-up`/`demo-deploy` keep the X-Beeper-Role dev/admin affordance
  # working with zero interactive steps — see helm/beeper/values.yaml and
  # demo/tests/test_demo_automation.py::TestFlaskEnvFailClosed.
  flaskEnv: development
  image:
    pullPolicy: Never
  service:
    type: NodePort
    # Pin the NodePort to match kind-config.yaml's host 5050 -> node 30050
    # mapping. Without this, K8s auto-assigns a random nodePort (e.g. 30351)
    # and the kind port mapping silently fails to reach the UI. Pinning it lets
    # the browser hit http://localhost:5050 directly (no port-forward needed).
    nodePort: 30050
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  ingress:
    enabled: true
    hosts:
      - host: beeper.local
        paths:
          - path: /
            pathType: Prefix

# Smaller Qdrant for development
qdrant:
  image:
    tag: "v1.15.0"
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

# Development LLM settings — local Ollama (no API costs)
# IMPORTANT: Ollama must bind all interfaces for kind cluster access:
#   OLLAMA_HOST=0.0.0.0 ollama serve
# Without this, investigator pods get connection timeouts to host.docker.internal.
llm:
  provider: ollama
  model: qwen3:8b
  endpoint: "http://host.docker.internal:11434"
  maxTokensPerInvestigation: 10000
  maxConcurrentInvestigations: 2

# Local observability stack
sources:
  prometheus:
    enabled: true
    endpoint: http://prometheus.otel-demo.svc.cluster.local:9090
  loki:
    enabled: false
