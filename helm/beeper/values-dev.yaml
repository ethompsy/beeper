# Development overrides for Beeper Helm chart

# Use local images for development
operator:
  image:
    pullPolicy: Never
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi

ui:
  image:
    pullPolicy: Never
  service:
    type: NodePort
    # Pin the NodePort to match kind-config.yaml's host 5050 -> node 30050
    # mapping. Without this, K8s auto-assigns a random nodePort (e.g. 30351)
    # and the kind port mapping silently fails to reach the UI. Pinning it lets
    # the browser hit http://localhost:5050 directly (no port-forward needed).
    nodePort: 30050
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  ingress:
    enabled: true
    hosts:
      - host: beeper.local
        paths:
          - path: /
            pathType: Prefix

# Smaller Qdrant for development
qdrant:
  image:
    tag: "v1.15.0"
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

# Development LLM settings — local Ollama (no API costs)
# IMPORTANT: Ollama must bind all interfaces for kind cluster access:
#   OLLAMA_HOST=0.0.0.0 ollama serve
# Without this, investigator pods get connection timeouts to host.docker.internal.
llm:
  provider: ollama
  model: qwen3:8b
  endpoint: "http://host.docker.internal:11434"
  maxTokensPerInvestigation: 10000
  maxConcurrentInvestigations: 2

# Local observability stack
sources:
  prometheus:
    enabled: true
    endpoint: http://prometheus.otel-demo.svc.cluster.local:9090
  loki:
    enabled: false
